name: Compilar DG-MasterBus y DG-Sender

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Guardar los plugins terminados
        uses: actions/upload-artifact@v4
        with:
          name: DG-Plugins-VST3-Windows
          path: |
            build/DGMasterBus_artefacts/Release/VST3/
            build/DGSender_artefacts/Release/VST3/
          if-no-files-found: error
