name: Compilar DG-MasterBus

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Guardar el plugin terminado
        uses: actions/upload-artifact@v4
        with:
          name: DG-MasterBus-VST3-Windows
          path: build/DGMasterBus_artefacts/Release/VST3/
          if-no-files-found: error
